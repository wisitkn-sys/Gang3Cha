name: Enable Fixed Station dashboard

on:
  push:
    paths:
      - '.github/workflows/enable-fixed-station.yml'

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Fixed Station assets to dashboard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          css_tag = '  <link rel="stylesheet" href="./fixed-station.css" />'
          if 'fixed-station.css' not in text:
              text = text.replace('  <link rel="stylesheet" href="./styles.css" />', '  <link rel="stylesheet" href="./styles.css" />\n' + css_tag)

          js_tag = '  <script src="./fixed-station.js"></script>'
          if 'fixed-station.js' not in text:
              text = text.replace('  <script src="./app.js"></script>', '  <script src="./app.js"></script>\n' + js_tag)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit dashboard integration
        shell: bash
        run: |
          rm -f .github/workflows/enable-fixed-station.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html fixed-station.js fixed-station.css .github/workflows/enable-fixed-station.yml
          git commit -m "Integrate Fixed Station dashboard"
          git push